<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuevo Evento | Punto UCA</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="form-container">
    <h2>Proponer Nuevo Evento</h2>
    <form id="formEvento">
      <input type="text" id="titulo" placeholder="Título del evento" required>
      <input type="date" id="fecha" required>
      <textarea id="descripcion" placeholder="Descripción" required></textarea>
      <button type="submit">Enviar Evento</button>
    </form>
  </main>

  <script src="js/nuevo-evento.js"></script>
</body>
</html>
